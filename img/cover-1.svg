<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8896f"/>
      <stop offset="52%" stop-color="#d2643f"/>
      <stop offset="100%" stop-color="#e8973c"/>
    </linearGradient>
    <radialGradient id="glow1" cx="22%" cy="26%" r="46%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="76%" r="44%">
      <stop offset="0%" stop-color="#e8896f" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#e8896f" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="46"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="5"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#base)"/>
  <g filter="url(#soft)" opacity="0.9">
    <circle cx="300" cy="180" r="200" fill="#ffffff" opacity="0.34"/>
    <circle cx="920" cy="520" r="230" fill="#e8973c" opacity="0.42"/>
    <circle cx="700" cy="120" r="150" fill="#d2643f" opacity="0.38"/>
  </g>
  <rect width="1200" height="675" fill="url(#glow1)"/>
  <rect width="1200" height="675" fill="url(#glow2)"/>
  <rect width="1200" height="675" filter="url(#grain)" opacity="0.05"/>
</svg>
